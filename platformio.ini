; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and example
; https://docs.platformio.org/page/projectconf.html

[platformio]

; default_envs = Arduino_GFX_PDQgraphicstest
; default_envs = Arduino_GFXDemo
; default_envs = factory
; default_envs = lv_demos
; default_envs = nes
; default_envs = sd
; default_envs = tft
; default_envs = TFT_Rainbow
; default_envs = touch_test
; default_envs = usb_hid_pad
; default_envs = ota
; default_envs = SerialExample
; default_envs = T-Display-S3-MIDI
; default_envs = ImageScroll
; default_envs = GetBatteryVoltage
; default_envs = PokerS3
; default_envs = PCBClock


;src_dir = examples/${platformio.default_envs}
boards_dir = ./boards

[env:KaffeewaageLilygoT-DisplayS3_20240212]
platform = espressif32@6.7.0
board = lilygo-t-display-s3
framework = arduino
lib_deps = 
    ;olkal/HX711_ADC@^1.2.12
    https://github.com/igorantolic/ai-esp32-rotary-encoder.git
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    bblanchon/ArduinoJson @ ^7.4.2

    

lib_ignore =
    GFX Library for Arduino
    arduino-nofrendo
    Adafruit MPR121
    DabbleESP32
    PCF8575 library
    PCA95x5
    lvgl
  

; extra_scripts =  ./script/pos_extra_script.py

build_flags = 
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -UARDUINO_USB_CDC_ON_BOOT
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DARDUINO_USB_MODE=1
    ; Choose different options according to different driver chips
    ; Early use of CST328
    -DTOUCH_MODULES_CST_MUTUAL
    ; Use CST816 by default
    ; -DTOUCH_MODULES_CST_SELF  
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    ; WebUI-Wartungs-Debug-Kommandos fuer Tests aktiv lassen.
    ; Zum Deaktivieren diese Zeile auskommentieren.
    -DWEBUI_DEBUG_COMMANDS=1

[env:lilygo-t4-s3-lvgl]
platform = espressif32@6.12.0
board = T-Display-AMOLED
framework = arduino

; LilyGO-AMOLED-Series repo must be cloned next to the project group:
; C:\Users\bernh\Documents\PlatformIO\Projects\LilyGo-AMOLED-Series
; From this project folder the relative path is ../../LilyGo-AMOLED-Series
lib_extra_dirs =
    ../../LilyGo-AMOLED-Series

lib_ignore =
    lib_deps

lib_deps =
    lvgl/lvgl @ 8.4.0
    lewisxhe/XPowersLib @ 0.2.7
    lewisxhe/SensorLib @ 0.2.4
    bodmer/TFT_eSPI @ 2.5.31

build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DCOFFEE_T4S3_LVGL=1

upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder

src_filter =
    -<*>
    +<t4s3_main.cpp>
    +<t4s3_wifi.cpp>
    +<t4s3_wifi.h>
    +<t4s3_time.cpp>
    +<t4s3_time.h>
    +<t4s3_settings.cpp>
    +<t4s3_settings.h>
    +<coffee_wifi.cpp>
    +<coffee_wifi.h>
    +<ui_t4s3/>



